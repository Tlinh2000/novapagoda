# Render Blueprint: một Web Service phục vụ cả HTML và Socket.io.
services:
  - type: web
    name: nova-pagoda
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: SESSION_SECRET
        generateValue: true
      - key: ABBOT_PASSWORD
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: nova_pagoda
